name: CI/CD Pipeline

# Controls when the workflow will run
on:
  push:
    branches: [ "main", "ci-cd", "develop" ]
  pull_request:
    branches: [ "main", "ci-cd" ]

jobs:
  # Job 1: Run Pytest & Code Quality Checks
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pytest>=7.4.0" "pytest-cov>=4.1.0" flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Check Code Syntax (Flake8)
      run: |
        # Stop build if there are syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Pytest Suite
      run: |
        pytest --cov=src --cov-report=term-missing

  # Job 2: Build Docker Image
  docker-build:
    needs: test  # Only run if tests pass
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false # Set to true if pushing to Docker Hub or GitHub Packages
        tags: disaster-classifier:latest
